site_name: Gastro Kitabı
site_description: Gastroenteroloji & hepatoloji hızlı başvuru
# GitHub Pages'e koyunca doldur:
site_url: https://kocagerahmet.github.io/gastro-kitabi/
theme:
  name: material
  language: tr
  palette:
    - scheme: default
      primary: teal
      toggle: {icon: material/brightness-7, name: Koyu tema}
    - scheme: slate
      primary: teal
      toggle: {icon: material/brightness-4, name: Açık tema}
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - search.suggest
    - search.highlight
    - toc.integrate
plugins:
  - search:
      lang: [tr, en]
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
extra_css:
  - stylesheets/extra.css
nav:
  - Ana sayfa: index.md
  - Sözlük: kisaltmalar.md
  - Luminal:
      - Kanama:
          - luminal/ugib.md
          - luminal/lgib.md
          - luminal/gizli-kanama.md
          - luminal/nadir-kanama-nedenleri.md
      - Özofagus:
          - luminal/disfaji.md
          - luminal/gerd.md
          - luminal/eoe.md
          - luminal/akalazya.md
      - Mide:
          - luminal/dispepsi-pud.md
          - luminal/gastroparezi.md
      - Bağırsak:
          - luminal/karin-agrisi.md
          - luminal/akut-ishal.md
          - luminal/kronik-ishal.md
          - luminal/colyak.md
          - luminal/cdi.md
          - luminal/ibs-kabizlik.md
          - luminal/kolon-polip.md
          - luminal/divertikul.md
          - luminal/iskemik.md
      - IBD:
          - luminal/ibd-uc.md
          - luminal/ibd-cd.md
          - luminal/ibd-akut.md
          - luminal/ibd-ilac.md
      - Nütrisyon:
          - luminal/beslenme.md
  - Pankreatobiliyer:
      - pankreatobiliyer/akut-pankreatit.md
      - pankreatobiliyer/kronik-pankreatit.md
      - pankreatobiliyer/pankreas-kist.md
      - pankreatobiliyer/pankreas-ca.md
      - pankreatobiliyer/safra-tasi.md
      - pankreatobiliyer/kolanjit.md
      - pankreatobiliyer/biliyer-striktur.md
  - Hepatoloji:
      - Genel & Akut:
          - hepatoloji/kcft.md
          - hepatoloji/alf.md
          - hepatoloji/dili.md
      - Viral:
          - hepatoloji/hbv.md
          - hepatoloji/hcv.md
          - hepatoloji/hdv-hev.md
      - Metabolik & Otoimmün:
          - hepatoloji/masld.md
          - hepatoloji/ald.md
